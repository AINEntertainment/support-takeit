version: "3.7"
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    build: ./
    image: frappe/bench:latest
    # --- START FIX: Use entrypoint for setup and command for bench start ---
    entrypoint: ["/workspace/init.sh"] 
    command: ["/bin/bash", "-c", "cd /home/frappe/frappe-bench && bench start"]
    # --- END FIX ---
    environment:
      - SHELL=/bin/bash
      # PORT=80 is no longer needed here as bench start handles routing/ports
    working_dir: /home/frappe/frappe-bench # FIX: Set to the actual bench root
    volumes:
      # FIX: Mount the current directory into the new working_dir location
      - .:/home/frappe/frappe-bench 
    depends_on:
      - mariadb
      - redis
    # The default bench setup uses port 8000 for its internal Nginx proxy
    expose:
      - "8000" 
    ports:
      # Map host port 80 to container's Nginx port 8000
      - "8080:8000"
      - "9000" # Keeping 9000 exposed for Socket.IO internal visibility
      - "8000" # Keeping 8000 exposed internally for direct access if needed

volumes:
  mariadb-data: