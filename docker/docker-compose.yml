version: "3.7"
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    build: ./docker/
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - PORT=80 # Set environment variable for Gunicorn/Bench
    working_dir: /home/frappe
    volumes:
      - .:/workspace
  # EXPOSE port 80. Coolify's reverse proxy will connect to this port.
    depends_on:
      - mariadb
      - redis
    # EXPOSE port 80. Coolify's reverse proxy will connect to this port.
    expose:
      - "80"
    # Keep 8000/9000 for internal network visibility if needed, but 80 is primary.
    ports:
      - "8000"
      - "9000"

volumes:
  mariadb-data: